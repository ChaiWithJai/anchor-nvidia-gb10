<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anchor Clinic | Attention Queue</title>
<style>
:root{--bg:#f4f6f4;--surface:#fff;--ink:#18211d;--muted:#65716b;--line:#d8ded9;--green:#176b4d;--green-soft:#e8f3ee;--red:#b73531;--red-soft:#f9e9e7;--amber:#8b5700;--amber-soft:#fff3d8;--blue:#285e8e;--blue-soft:#e9f1f8;--charcoal:#28332e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:inherit}.hidden{display:none!important}
.topbar{min-height:60px;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.mark,.avatar{display:grid;place-items:center;background:var(--charcoal);color:#fff;font-weight:800}.mark{width:34px;height:34px;border-radius:6px}.brand strong{display:block;font-size:15px}.brand span{display:block;color:var(--muted);font-size:11px}.top-actions{display:flex;align-items:center;gap:8px}.runtime-dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}.runtime-dot.ready{background:#5c9300}.link,.button{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:12px;font-weight:700}.button.primary{border-color:var(--green);background:var(--green);color:#fff}.button.danger{border-color:#dba8a5;color:var(--red)}.button.subtle{background:transparent}
.main{width:min(1580px,100%);margin:auto;padding:20px 24px 36px}.work-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px}.work-head h1{margin:0;font-size:24px}.work-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.attention-count{font-size:12px;color:var(--muted)}.attention-count strong{color:var(--red);font-size:20px;margin-right:5px}.demo-label{padding:5px 8px;border:1px solid #dfbf72;border-radius:5px;background:var(--amber-soft);color:#684100;font-size:10px;font-weight:800}
.toolbar{padding:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.search{height:38px;min-width:220px;flex:1;padding:0 11px;border:1px solid var(--line);border-radius:5px}.filters{display:flex;gap:5px;flex-wrap:wrap}.filter{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--muted);font-size:11px;font-weight:750}.filter.active{border-color:var(--green);background:var(--green-soft);color:var(--green)}.clinician{height:36px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:0 9px;font-size:11px}
.workspace{min-height:690px;border:1px solid var(--line);border-top:0;background:var(--surface);display:grid;grid-template-columns:390px minmax(0,1fr)}.queue{min-width:0;border-right:1px solid var(--line)}.queue-head{height:48px;padding:0 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.queue-head strong{font-size:12px}.queue-head span{color:var(--muted);font-size:10px}.patient-list{max-height:calc(100vh - 235px);min-height:640px;overflow:auto;padding:6px}.patient-row{width:100%;padding:12px 10px;border:1px solid transparent;border-radius:6px;background:#fff;text-align:left;display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px}.patient-row+ .patient-row{border-top-color:#edf0ed;border-radius:0}.patient-row:hover{background:#f8faf8}.patient-row.active{border-color:#a9cdbd!important;border-radius:6px;background:var(--green-soft)}.avatar{width:38px;height:38px;border-radius:50%}.row-top{display:flex;justify-content:space-between;gap:8px}.row-top strong{font-size:12px}.tier{white-space:nowrap;padding:3px 6px;border-radius:4px;font-size:9px;font-weight:850;text-transform:uppercase}.tier-3{background:var(--red-soft);color:var(--red)}.tier-2{background:var(--amber-soft);color:var(--amber)}.tier-1{background:var(--blue-soft);color:var(--blue)}.tier-0{background:#edf1ee;color:#52605a}.why{margin:5px 0 3px;color:#3f4b45;font-size:10px;line-height:1.35}.row-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:9px}.overdue{color:var(--red);font-weight:800}.empty{padding:34px 18px;color:var(--muted);text-align:center}
.detail{min-width:0}.detail-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}.identity{display:flex;align-items:center;gap:11px;min-width:0}.identity .avatar{width:44px;height:44px;background:var(--green)}.identity h2{margin:0;font-size:17px}.identity p{margin:2px 0 0;color:var(--muted);font-size:10px}.detail-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.priority-band{padding:10px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(180px,1fr) minmax(150px,.6fr) auto;gap:14px;align-items:center;background:#fafbfa}.priority-band strong{font-size:11px}.priority-band span{display:block;color:var(--muted);font-size:10px}.tabs{min-height:44px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;gap:19px;overflow-x:auto}.tab{min-height:44px;padding:0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);white-space:nowrap;font-size:11px;font-weight:800}.tab.active{border-bottom-color:var(--green);color:var(--green)}.panel{padding:18px;min-width:0}.section{margin-bottom:24px}.section h3{margin:0 0 10px;font-size:12px}.section-headline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.section-headline h3{margin:0}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.fact{min-width:0;padding:11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.fact label{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase}.fact span{display:block;margin-top:4px;font-size:11px;overflow-wrap:anywhere}.record-list{display:grid;border-top:1px solid var(--line)}.record{padding:11px 2px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.record strong{font-size:11px}.record p{margin:3px 0;color:#3f4b45;font-size:11px}.record small,.provenance{color:var(--muted);font-size:9px}.record time{color:var(--muted);font-size:9px;white-space:nowrap}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.7fr);gap:24px}.plan-list{margin:0;padding-left:18px;font-size:11px}.plan-list li{margin:7px 0}.form{display:grid;gap:11px}.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:4px}.field label{color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase}.field input,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:5px;background:#fff}.field textarea{min-height:92px;resize:vertical}.form-actions{display:flex;align-items:center;gap:8px}.status-text{font-size:10px;color:var(--green)}.alert{padding:11px;border-left:3px solid var(--red);background:var(--red-soft);margin-bottom:9px}.alert strong{font-size:10px;text-transform:uppercase}.alert p{font-size:11px}.alert textarea{width:100%;min-height:58px;border:1px solid #ddb5b2;border-radius:5px;padding:8px}.analysis{padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}.loading{padding:80px;text-align:center;color:var(--muted)}.proof{font-size:11px;color:var(--muted)}.proof summary{cursor:pointer;font-weight:700}.proof-body{position:absolute;right:22px;top:56px;z-index:4;width:min(420px,calc(100vw - 24px));padding:12px;border:1px solid var(--line);background:#fff;box-shadow:0 8px 28px rgba(20,30,25,.12)}
@media(max-width:980px){.workspace{grid-template-columns:330px minmax(0,1fr)}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.priority-band{grid-template-columns:auto 1fr}.priority-band>:nth-child(3),.priority-band>:nth-child(4){grid-column:2}}
@media(max-width:760px){.topbar{padding:9px 12px}.brand span,.runtime-text{display:none}.main{padding:14px 10px}.work-head{align-items:flex-start}.workspace{display:block}.queue{border-right:0;border-bottom:1px solid var(--line)}.patient-list{min-height:0;max-height:310px}.detail-head{align-items:flex-start;flex-direction:column}.detail-actions{justify-content:flex-start}.facts,.form-row{grid-template-columns:1fr}.priority-band{grid-template-columns:auto 1fr}.panel{padding:14px}.toolbar{align-items:stretch}.search{min-width:100%}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="mark">A</div><div><strong>Anchor Clinic</strong><span>Recovery care operations</span></div></div>
  <div class="top-actions"><i id="runtimeDot" class="runtime-dot"></i><span id="runtimeText" class="runtime-text">Checking local runtime</span><details class="proof"><summary>Demo proof</summary><div id="proofBody" class="proof-body">Loading local workload evidence</div></details><a class="link" href="/patient">Patient call</a></div>
</header>
<main class="main">
  <header class="work-head"><div><h1>Needs attention now</h1><p>Priority queue for the Anchor Recovery Team</p></div><div><span class="demo-label">Synthetic clinic data</span> <span class="attention-count"><strong id="needsCount">-</strong>patients need review</span></div></header>
  <section class="toolbar" aria-label="Patient queue filters">
    <input id="search" class="search" type="search" placeholder="Search patients or programs" aria-label="Search patients">
    <div id="filters" class="filters"></div>
    <select id="clinicianFilter" class="clinician" aria-label="Filter by clinician"><option value="">All care-team members</option><option value="clinician-maya">Dr. Maya Chen</option><option value="clinician-omar">Omar Reed, LCSW</option></select>
  </section>
  <section class="workspace">
    <aside class="queue"><div class="queue-head"><strong>Patient queue</strong><span id="queueCount">Loading</span></div><div id="patientList" class="patient-list"><div class="loading">Loading priority queue</div></div></aside>
    <article id="detail" class="detail"><div class="loading">Select a patient</div></article>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const state={filter:localStorage.getItem("anchorQueueFilter")||"needs_action",search:"",clinician:"",selectedId:localStorage.getItem("anchorSelectedPatient")||"demo-jai",tab:localStorage.getItem("anchorPatientTab")||"chart",patients:[],queue:null,activity:[],editingPlan:false};
const filterDefs=[["needs_action","Needs action"],["tier-3","Immediate"],["tier-2","Elevated"],["tier-1","Watch"],["tier-0","Routine"],["overdue","Overdue"],["all","All"]];
function fmt(value){if(!value)return"Not available";const date=new Date(value);return Number.isNaN(date.valueOf())?String(value):date.toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
async function api(path,options={}){const response=await fetch(path,options);if(!response.ok){let message="Request failed";try{message=(await response.json()).detail||message}catch(_){ }throw new Error(message)}return response.headers.get("content-type")?.includes("json")?response.json():response}
function tierCount(id){return state.queue?.tiers?.find(item=>item.risk_tier_id===id)?.count||0}
function filterCount(id){if(id==="all")return state.queue?.counts?.all||0;if(id==="needs_action")return state.queue?.counts?.needs_action||0;if(id==="overdue")return state.queue?.counts?.overdue||0;return tierCount(id)}
function renderFilters(){$("filters").innerHTML=filterDefs.map(([id,label])=>`<button class="filter ${state.filter===id?"active":""}" data-filter="${id}" type="button">${label} ${filterCount(id)}</button>`).join("");$("filters").querySelectorAll("button").forEach(button=>button.onclick=()=>{state.filter=button.dataset.filter;localStorage.setItem("anchorQueueFilter",state.filter);loadRoster()})}
function query(){const params=new URLSearchParams;if(state.filter==="needs_action")params.set("needs_action","true");else if(state.filter==="overdue")params.set("overdue","true");else if(state.filter!=="all")params.set("tier",state.filter);if(state.search)params.set("search",state.search);if(state.clinician)params.set("clinician_id",state.clinician);return params.toString()}
async function loadRoster(){try{const data=await api("/api/clinic/patients?"+query());state.patients=data.patients;state.queue=data.queue;if(!state.patients.some(item=>item.patient_id===state.selectedId))state.selectedId=state.patients[0]?.patient_id||"";$("needsCount").textContent=data.queue.counts.needs_action;$("queueCount").textContent=`${state.patients.length} shown / ${data.queue.counts.all} total`;renderFilters();renderQueue();renderDetail()}catch(error){$("patientList").innerHTML=`<div class="empty">${esc(error.message)}. Retry the local workload.</div>`}}
function renderQueue(){if(!state.patients.length){$("patientList").innerHTML='<div class="empty">No patients match these filters.</div>';return}$("patientList").innerHTML=state.patients.map(patient=>`<button type="button" class="patient-row ${patient.patient_id===state.selectedId?"active":""}" data-patient="${esc(patient.patient_id)}"><span class="avatar">${esc(patient.display_name.slice(0,1))}</span><span><span class="row-top"><strong>${esc(patient.display_name)}</strong><span class="tier ${esc(patient.risk_tier_id)}">${esc(patient.risk_label)}</span></span><span class="why">${esc(patient.risk_reason)}</span><span class="row-meta"><span>${esc(patient.clinician_name)}</span><span class="${patient.overdue?"overdue":""}">${patient.overdue?"Overdue / ":""}${esc(patient.next_action)}</span></span></span></button>`).join("");$("patientList").querySelectorAll("[data-patient]").forEach(button=>button.onclick=()=>{state.selectedId=button.dataset.patient;state.tab="chart";localStorage.setItem("anchorSelectedPatient",state.selectedId);renderQueue();renderDetail()})}
function patient(){return state.patients.find(item=>item.patient_id===state.selectedId)}
function record(title,body,source,time){return `<div class="record"><div><strong>${esc(title)}</strong><p>${esc(body)}</p><small>${esc(source||"Source not available")}</small></div><time>${fmt(time)}</time></div>`}
function shell(p){return `<header class="detail-head"><div class="identity"><span class="avatar">${esc(p.display_name.slice(0,1))}</span><div><h2>${esc(p.display_name)}</h2><p>${esc(p.program)} / ${esc(p.clinician_name)}</p></div></div><div class="detail-actions"><button class="button" data-action="chart">Open chart</button><button class="button" data-action="note">Add note</button><a class="button primary" href="/patient?patient_id=${encodeURIComponent(p.patient_id)}">Start check-in</a></div></header><section class="priority-band"><span class="tier ${esc(p.risk_tier_id)}">${esc(p.risk_label)}</span><div><strong>Why now</strong><span>${esc(p.risk_reason)}</span></div><div><strong>Next action</strong><span>${esc(p.next_action)}</span></div><div><strong>${p.overdue?"Overdue":"Due"}</strong><span>${fmt(p.action_due_at)}</span></div></section><nav class="tabs" aria-label="Patient record"><button class="tab" data-tab="chart">Chart</button><button class="tab" data-tab="notes">Notes</button><button class="tab" data-tab="history">History</button><button class="tab" data-tab="labs">Labs</button><button class="tab" data-tab="plan">Care plan</button><button class="tab" data-tab="alerts">Alerts / analyses</button><button class="tab" data-tab="audit">Audit</button></nav><section id="panel" class="panel"></section>`}
function chartView(p){const conditions=p.conditions||[],goals=p.goals||[];return `<section class="section"><h3>Canonical patient chart</h3><div class="facts"><div class="fact"><label>Status</label><span>${esc(p.status)}</span></div><div class="fact"><label>Assigned clinician</label><span>${esc(p.clinician_name)}</span></div><div class="fact"><label>Last contact</label><span>${fmt(p.last_check_in_at)}</span></div><div class="fact"><label>Next check-in</label><span>${fmt(p.next_check_in)}</span></div><div class="fact"><label>Voice preference</label><span>${esc(p.voice_mode)}${p.voice_id?" / "+esc(p.voice_id):""}</span></div><div class="fact"><label>Care team</label><span>${esc(p.care_team?.name||"Not available")}</span></div></div></section><div class="columns"><section class="section"><h3>Conditions</h3><div class="record-list">${conditions.length?conditions.map(item=>record(item.label,item.status,item.source,item.recorded_at)).join(""):'<div class="empty">No canonical condition records available.</div>'}</div></section><section class="section"><h3>Active recovery goals</h3><div class="record-list">${goals.length?goals.map(item=>record(item.title,`Target: ${item.target} ${item.unit} / ${item.tracking_window_days}-day window`,"Clinician-authored recovery plan",item.created_at)).join(""):'<div class="empty">No active goals available.</div>'}</div></section></div>`}
function notesView(p){const notes=p.notes||[];return `<section class="section"><div class="section-headline"><h3>Clinician notes</h3><span class="provenance">Canonical authored records</span></div><form id="noteForm" class="form"><div class="form-row"><div class="field"><label for="noteTitle">Note title</label><input id="noteTitle" required maxlength="120" value="Follow-up review"></div><div class="field"><label for="noteAuthor">Author</label><input id="noteAuthor" required maxlength="80" value="${esc(p.clinician_name)}"></div></div><div class="field"><label for="noteBody">Clinical note</label><textarea id="noteBody" required maxlength="2000" placeholder="Document the reviewed facts and next action."></textarea></div><div class="form-actions"><button class="button primary" type="submit">Add canonical note</button><span id="noteState" class="status-text"></span></div></form></section><section class="section"><div class="record-list">${notes.length?notes.map(item=>record(item.title,item.body,`${item.author} / ${item.source}`,item.authored_at)).join(""):'<div class="empty">No notes available.</div>'}</div></section>`}
function historyView(p){const entries=[];(p.recent_calls||[]).forEach(item=>entries.push({time:item.started_at,title:"Anchor check-in",body:item.summary||"No generated summary",source:"Generated summary / local call record"}));(p.notes||[]).forEach(item=>entries.push({time:item.authored_at,title:item.title,body:item.body,source:item.author+" / canonical note"}));(p.alerts||[]).forEach(item=>entries.push({time:item.created_at,title:item.status==="open"?"Open escalation":"Resolved escalation",body:item.reason,source:"Deterministic safety workflow"}));entries.sort((a,b)=>new Date(b.time)-new Date(a.time));return `<section class="section"><h3>Unified patient history</h3><div class="record-list">${entries.length?entries.map(item=>record(item.title,item.body,item.source,item.time)).join(""):'<div class="empty">No patient history available.</div>'}</div></section>`}
function labsView(p){const labs=p.labs||[];return `<section class="section"><div class="section-headline"><h3>Labs</h3><span class="provenance">Source, unit, range, and collection time</span></div><div class="record-list">${labs.length?labs.map(item=>record(item.name,`${item.value} ${item.unit} / Reference: ${item.reference_range}`,item.source,item.collected_at)).join(""):'<div class="empty">Not available. Anchor does not synthesize missing lab results.</div>'}</div></section>`}
function planView(p){const plan=p.plan||{};if(state.editingPlan)return `<section class="section"><h3>Edit care plan / explicit publish mode</h3><form id="planForm" class="form"><div class="form-row"><div class="field"><label>Author</label><input id="planAuthor" value="${esc(plan.author)}"></div><div class="field"><label>Program</label><input id="planProgram" value="${esc(plan.program)}"></div></div><div class="field"><label>Today's commitments / one per line</label><textarea id="planToday">${esc((plan.today||[]).join("\n"))}</textarea></div><div class="field"><label>Check-in topics / one per line</label><textarea id="planCheckin">${esc((plan.check_in||[]).join("\n"))}</textarea></div><div class="field"><label>Allowed options / one per line</label><textarea id="planOptions">${esc((plan.options||[]).join("\n"))}</textarea></div><div class="field"><label>On-call destination</label><input id="planOnCall" value="${esc(plan.on_call)}"></div><div class="form-actions"><button class="button primary" type="submit">Publish version ${Number(plan.version||0)+1}</button><button id="cancelPlan" class="button" type="button">Cancel</button><span id="planState" class="status-text"></span></div></form></section>`;return `<section class="section"><div class="section-headline"><div><h3>Published care plan / version ${esc(plan.version)}</h3><span class="provenance">${esc(plan.author)} / canonical clinician-authored record</span></div><button id="editPlan" class="button">Edit care plan</button></div><div class="columns"><div><strong>Today's commitments</strong><ul class="plan-list">${(plan.today||[]).map(item=>`<li>${esc(item)}</li>`).join("")}</ul></div><div><strong>Approved options</strong><ul class="plan-list">${(plan.options||[]).map(item=>`<li>${esc(item)}</li>`).join("")}</ul></div></div></section><section class="section"><h3>Immutable revisions</h3><div class="record-list">${(p.plan_revisions||[]).map(item=>record(`Version ${item.version}`,item.today?.join(" / ")||"No commitments",item.published_by,item.published_at)).join("")}</div></section>`}
function alertsView(p){const alerts=p.alerts||[],analyses=p.voice_analyses||[];return `<section class="section"><h3>Escalations requiring review</h3>${alerts.filter(item=>item.status==="open").length?alerts.filter(item=>item.status==="open").map(item=>`<article class="alert"><strong>${esc(item.risk_tier_id||"tier-"+item.triage_tier)} / ${esc(item.severity)}</strong><p>${esc(item.reason)}</p><small>Created ${fmt(item.created_at)} / Delivery ${esc(item.agent_delivery?.status||"not available")}</small><form class="resolveForm" data-alert="${esc(item.id)}"><textarea required maxlength="300" placeholder="Resolution note"></textarea><button class="button danger" type="submit">Resolve and audit</button></form></article>`).join(""):'<div class="empty">No open escalations. The next scheduled review remains visible in the queue.</div>'}</section><section class="section"><h3>Voice analyses</h3>${analyses.length?analyses.map(item=>`<div class="analysis"><strong>${esc(item.risk_tier_id)}</strong> / ${esc(item.status)}<p>${esc(item.summary)}</p><small>${esc(item.rule_version||"Legacy rule")} / ${fmt(item.created_at)}</small></div>`).join(""):'<div class="empty">No voice analyses available.</div>'}</section>`}
function auditView(p){const events=state.activity.filter(item=>!item.patient_id||item.patient_id===p.patient_id);return `<section class="section"><h3>Audit trail</h3><div class="record-list">${events.length?events.map(item=>record(item.action,item.detail,item.actor,item.created_at)).join(""):'<div class="empty">No audit events available.</div>'}</div></section>`}
function renderDetail(){const p=patient();if(!p){$("detail").innerHTML='<div class="empty">No patient selected.</div>';return}$("detail").innerHTML=shell(p);$("detail").querySelectorAll("[data-tab]").forEach(button=>{button.classList.toggle("active",button.dataset.tab===state.tab);button.onclick=()=>{state.tab=button.dataset.tab;localStorage.setItem("anchorPatientTab",state.tab);renderDetail()}});$("detail").querySelector('[data-action="chart"]').onclick=()=>{state.tab="chart";renderDetail()};$("detail").querySelector('[data-action="note"]').onclick=()=>{state.tab="notes";renderDetail()};const views={chart:chartView,notes:notesView,history:historyView,labs:labsView,plan:planView,alerts:alertsView,audit:auditView};$("panel").innerHTML=(views[state.tab]||chartView)(p);bindPanel(p)}
function lines(id){return $(id).value.split("\n").map(item=>item.trim()).filter(Boolean)}
function bindPanel(p){if($("noteForm"))$("noteForm").onsubmit=async event=>{event.preventDefault();$("noteState").textContent="Saving";try{await api(`/api/clinic/patients/${p.patient_id}/notes`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("noteTitle").value,body:$("noteBody").value,author:$("noteAuthor").value})});await loadRoster();state.tab="notes";renderDetail()}catch(error){$("noteState").textContent=error.message}};if($("editPlan"))$("editPlan").onclick=()=>{state.editingPlan=true;renderDetail()};if($("cancelPlan"))$("cancelPlan").onclick=()=>{state.editingPlan=false;renderDetail()};if($("planForm"))$("planForm").onsubmit=async event=>{event.preventDefault();$("planState").textContent="Publishing";try{await api(`/api/clinic/patients/${p.patient_id}/plan`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({author:$("planAuthor").value,program:$("planProgram").value,today:lines("planToday"),check_in:lines("planCheckin"),options:lines("planOptions"),on_call:$("planOnCall").value})});state.editingPlan=false;await loadRoster();state.tab="plan";renderDetail()}catch(error){$("planState").textContent=error.message}};document.querySelectorAll(".resolveForm").forEach(form=>form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector("button");button.disabled=true;try{await api(`/api/clinic/alerts/${form.dataset.alert}/resolve`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({resolved_by:p.clinician_name,clinician_id:p.clinician_id,note:form.querySelector("textarea").value})});await bootstrap()}catch(error){button.disabled=false;button.textContent=error.message}})}
async function bootstrap(){const [status,activity]=await Promise.all([api("/api/status"),api("/api/clinic/activity")]);state.activity=activity.events||[];$("runtimeDot").classList.toggle("ready",status.ready);$("runtimeText").textContent=status.ready?"Local workload ready":"Local workload loading";$("proofBody").innerHTML=`<strong>${esc(status.runtime)}</strong><p>${esc(status.llm)} / ${esc(status.voice)}</p><p>MongoDB ${esc(status.database.version)} / ${esc(status.database.collections)} collections</p><p>${esc(status.agent_runtime.name)} / ${esc(status.agent_runtime.configured?"configured":"not configured")}</p>`;await loadRoster()}
let searchTimer;$("search").oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.search=$("search").value.trim();loadRoster()},250)};$("clinicianFilter").onchange=()=>{state.clinician=$("clinicianFilter").value;loadRoster()};bootstrap().catch(error=>{$("detail").innerHTML=`<div class="empty">${esc(error.message)}</div>`});
</script>
<script src="/goal-client.js"></script>
