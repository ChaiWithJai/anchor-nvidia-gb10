[project]
name = "careline"
version = "0.1.0"
description = "CareLine — B2B eldercare voice check-in agent (Mac prototype for GB10 hackathon)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets==15.0.1",
    "httpx>=0.27",
    "pymongo==4.17.0",
    "dnspython==2.8.0",
]

[project.optional-dependencies]
apple = [
    "mlx-audio>=0.5.0",
    "misaki[en]>=0.9.4",
]
[tool.uv]
package = false
