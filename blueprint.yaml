name: anchor-nvidia-gb10
version: 2.0.0
status: hackathon-poc
hardware:
  platform: NVIDIA GB10
  architecture: arm64
models:
  conversation: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
  cloned_voice: sesame/csm-1b
interfaces:
  clinician: /
  patient: /patient
  input: browser-speech-or-text
  output: cuda-cloned-wav
  system_of_record: mongodb-8
agent_stack:
  components:
    - openclaw-2026.5.27
    - nvidia-openshell-0.0.106
  escalation_hook: /hooks/wake
  delivery_audit: mongodb
  autonomous_patient_contact: false
  default: fail-closed-disabled
  inference_route: forced-local-nemotron
  hosted_nemoclaw_plugin: disabled
privacy:
  inference: local
  voice_reference: read-only-external-mount
  consent_required: true
  synthetic_demo_data_only: true
verification:
  command: python3 scripts/verify-nvidia.py
